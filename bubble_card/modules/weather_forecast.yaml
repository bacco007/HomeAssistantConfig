weather_forecast:
  name: Bubble Weather
  version: v1.2.0
  creator: Clooos
  supported:
    - button
  description: |
    Full weather card with weather-based animations and daily or hourly forecasts.
    <br><br>
    Create a new Button card, set the button type to "State", choose any "weather" entity, and the module takes care of the rest.
    <br><br>
    <img src="https://raw.githubusercontent.com/Clooos/Bubble-Card/refs/heads/main/img/bubble-weather-module.gif" />
    <br><br>
    <code-block><pre>
    weather_forecast:
        type: daily
        max_days: 5
        disable_dynamic_background: false
        disable_animations: false
    </pre></code-block>
  editor:
    - type: expandable
      title: Forecast
      icon: mdi:calendar-clock
      schema:
        - name: type
          label: Forecast type
          selector:
            select:
              options:
                - label: Daily
                  value: daily
                - label: Hourly
                  value: hourly
                - label: Twice daily
                  value: twice_daily
        - name: max_days
          label: Max items
          selector:
            number:
              min: 1
              max: 10
    - type: expandable
      title: Layout and styling
      icon: mdi:palette
      schema:
        - name: disable_animations
          label: Disable animations
          selector:
            boolean: {}
        - name: disable_dynamic_background
          label: Disable weather based background
          selector:
            boolean: {}
        - name: hide_icon_background
          label: Hide icon background
          selector:
            boolean: {}
        - name: scale
          label: Forecast size
          selector:
            number:
              min: 0.8
              max: 2
              step: 0.1
              mode: slider
        - name: min_day_width
          label: Min column width in px
          selector:
            number:
              min: 50
              max: 160
        - name: card_layout
          label: Card layout
          selector:
            select:
              options:
                - label: Default
                  value: default
                - label: Square card
                  value: square
                - label: Weather only
                  value: weather_only_bg
                - label: Weather only (hide header and background)
                  value: weather_only
                - label: Background only (hide weather)
                  value: background_only
                - label: Background only (hide weather and header)
                  value: background_only_minimal
  suggestions:
    - label: Default
      domains:
        - weather
      config:
        card_type: button
        button_type: state
        entity: ${entity}
        show_state: true
        show_last_changed: false
        sub_button:
          main:
            - name: Temperature
              css_class: highlight
              attribute: temperature
              show_attribute: true
              show_icon: false
              show_background: false
              fill_width: false
              hide_when_parent_unavailable: true
        styles: |-
          .highlight .bubble-sub-button-name-container,
          .highlight .scrolling-container,
          .highlight .scrolling-container span {
            font-size: var(--bubble-sub-button-highlight-font-size, 20px) !important;
            font-weight: var(--bubble-sub-button-highlight-font-weight, 300) !important;
            white-space: nowrap !important;
            overflow: hidden !important;
          }
        grid_options:
          columns: 6
        weather_forecast:
          card_layout: default
    - label: Default (hourly)
      domains:
        - weather
      config:
        card_type: button
        button_type: state
        entity: ${entity}
        show_state: true
        show_last_changed: false
        sub_button:
          main:
            - name: Temperature
              css_class: highlight
              attribute: temperature
              show_attribute: true
              show_icon: false
              show_background: false
              fill_width: false
              hide_when_parent_unavailable: true
        styles: |-
          .highlight .bubble-sub-button-name-container,
          .highlight .scrolling-container,
          .highlight .scrolling-container span {
            font-size: var(--bubble-sub-button-highlight-font-size, 20px) !important;
            font-weight: var(--bubble-sub-button-highlight-font-weight, 300) !important;
            white-space: nowrap !important;
            overflow: hidden !important;
          }
        grid_options:
          columns: 6
        weather_forecast:
          card_layout: default
          type: hourly
    - label: Square card
      domains:
        - weather
      config:
        card_type: button
        button_type: state
        entity: ${entity}
        show_state: true
        show_last_changed: false
        sub_button:
          main:
            - name: Temperature
              css_class: highlight
              attribute: temperature
              show_attribute: true
              show_icon: false
              show_background: false
              fill_width: false
              hide_when_parent_unavailable: true
        styles: |-
          .highlight .bubble-sub-button-name-container,
          .highlight .scrolling-container,
          .highlight .scrolling-container span {
            font-size: var(--bubble-sub-button-highlight-font-size, 20px) !important;
            font-weight: var(--bubble-sub-button-highlight-font-weight, 300) !important;
            white-space: nowrap !important;
            overflow: hidden !important;
          }
        grid_options:
          columns: 6
        weather_forecast:
          card_layout: square
    - label: Square card (hourly)
      domains:
        - weather
      config:
        card_type: button
        button_type: state
        entity: ${entity}
        show_state: true
        show_last_changed: false
        sub_button:
          main:
            - name: Temperature
              css_class: highlight
              attribute: temperature
              show_attribute: true
              show_icon: false
              show_background: false
              fill_width: false
              hide_when_parent_unavailable: true
        styles: |-
          .highlight .bubble-sub-button-name-container,
          .highlight .scrolling-container,
          .highlight .scrolling-container span {
            font-size: var(--bubble-sub-button-highlight-font-size, 20px) !important;
            font-weight: var(--bubble-sub-button-highlight-font-weight, 300) !important;
            white-space: nowrap !important;
            overflow: hidden !important;
          }
        grid_options:
          columns: 6
        weather_forecast:
          card_layout: square
          type: hourly
    - label: Weather only
      domains:
        - weather
      config:
        card_type: button
        button_type: state
        entity: ${entity}
        show_state: true
        show_last_changed: false
        grid_options:
          columns: 6
        weather_forecast:
          card_layout: weather_only_bg
    - label: Weather only (hourly)
      domains:
        - weather
      config:
        card_type: button
        button_type: state
        entity: ${entity}
        show_state: true
        show_last_changed: false
        grid_options:
          columns: 6
        weather_forecast:
          card_layout: weather_only_bg
          type: hourly
    - extends: base
      domains:
        - weather
      label: Weather only (hide header and background)
      config:
        weather_forecast:
          card_layout: weather_only
    - extends: base
      domains:
        - weather
      label: Weather only (hourly, hide header and background)
      config:
        weather_forecast:
          card_layout: weather_only
          type: hourly
    - extends: base
      domains:
        - weather
      label: Background only (hide weather)
      config:
        weather_forecast:
          card_layout: background_only
    - extends: base
      domains:
        - weather
      label: Background only (hide weather and header)
      config:
        weather_forecast:
          card_layout: background_only_minimal
  code: |-
    .bubble-container::before {
    display: none;
    }
    .bubble-main-icon-container.bc-wx-hide-icon-bg {
    background: transparent !important;
    }
    .bubble-container.bc-weather-card {
    overflow: hidden;
    scrollbar-gutter: stable both-edges;
    isolation: isolate;
    contain: layout style paint;
    }
    .bubble-container.bc-weather-card:not(.bc-wx-background-only) {
    min-height: 180px;
    }
    .bc-weather-card:not(.bc-wx-background-only) .bubble-sub-button-container {
    align-self: flex-start !important;
    }
    .bc-weather-card:not(.bc-wx-background-only) .bubble-sub-button-bottom-container {
    bottom: var(--bc-wx-bottom-offset, 0px) !important;
    }
    .bc-weather-card.bc-wx-no-bottom-room .bubble-sub-button-bottom-container {
    display: none !important;
    }
    .bc-weather-card:not(.bc-wx-background-only).bc-wx-hidden .bubble-sub-button-bottom-container {
    bottom: unset !important;
    }
    .bc-weather-card.bc-wx-background-only .bubble-sub-button-container {
    margin-top: 0 !important;
    }
    .bc-weather-card.bc-wx-background-only.bc-wx-has-bottom-sub-buttons .bubble-sub-button-container {
    margin-top: 10px !important;
    }
    .bc-weather-card.bc-wx-background-only-minimal .bubble-sub-button-container {
    display: none !important;
    }
    .bc-weather-card.bc-wx-background-only-minimal .bubble-sub-button-bottom-container {
    position: static !important;
    top: auto !important;
    bottom: auto !important;
    width: calc(100% - 16px) !important;
    margin: 0 8px 0 8px !important;
    pointer-events: auto !important;
    }
    .bc-weather-card.bc-wx-weather-only .bubble-sub-button-container,
    .bc-weather-card.bc-wx-weather-only .bubble-sub-button-bottom-container {
    display: none !important;
    }
    .bubble-container.bc-weather-card.bc-square-card {
    aspect-ratio: 1 / 1 !important;
    height: 100% !important;
    }
    .bubble-container.bc-weather-card.bc-square-card:not(.bc-wx-background-only) {
    min-height: 0 !important;
    }
    .bc-weather-card .bubble-wrapper {
    inset: 0;
    width: 100%;
    }
    .bc-weather-card .bubble-background {
    inset: 0;
    width: 100%;
    }
    .bc-weather-card .bubble-wrapper.fixed-top {
    align-items: center;
    }
    .fixed-top .bubble-sub-button-container {
    margin-top: 10px;
    }
    .bubble-wrapper.fixed-top .bubble-content-container {
    display: flex;
    align-items: center;
    align-self: flex-start;
    overflow: hidden;
    flex-grow: 1;
    margin-top: 1px;
    }
    .bc-wx-p-wrap {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    contain: strict;
    transform: translateZ(0);
    }
    .bc-wx-p-wrap .row {
    position: absolute;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    }
    .bc-wx-p-wrap .row.back {
    z-index: 1;
    opacity: 0.85;
    filter: blur(.2px);
    }
    .bc-wx-p-wrap.bc-stars .row {
    z-index: 0;
    }
    .bc-wx-p {
    position: absolute;
    pointer-events: none;
    will-change: transform;
    animation-fill-mode: both;
    --d: 1s;
    --dl: 0s;
    }
    .bc-wx-p.rain {
    bottom: 100%;
    width: 15px;
    height: 120px;
    animation: bc-wx-drop var(--d) linear infinite;
    animation-delay: var(--dl);
    --rain-r: 255;
    --rain-g: 255;
    --rain-b: 255;
    --rain-a: .28;
    --rain-w: 1.2px;
    --rain-h: 80%;
    }
    .bc-wx-p.rain::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 0;
    width: var(--rain-w, 1.2px);
    height: var(--rain-h, 80%);
    background:
    linear-gradient(
    to bottom,
    rgba(var(--rain-r),var(--rain-g),var(--rain-b),0),
    rgba(var(--rain-r),var(--rain-g),var(--rain-b),var(--rain-a))
    );
    animation: bc-wx-stem var(--d) linear infinite;
    animation-delay: var(--dl);
    }
    @keyframes bc-wx-drop {
    0% { transform: translate3d(0, -120px, 0); }
    100% { transform: translate3d(0, 110vh, 0); }
    }
    @keyframes bc-wx-stem {
    0%, 90% { opacity: 1; }
    100% { opacity: 0; }
    }
    .bc-wx-p.snow {
    top: -16px;
    border-radius: 50%;
    background:
    radial-gradient(
    circle,
    rgba(255,255,255,1) 0 52%,
    rgba(255,255,255,.96) 65%,
    rgba(255,255,255,0) 80%
    );
    box-shadow:
    0 0 0 1px rgba(255,255,255,.9),
    0 1px 2px rgba(0,0,0,.06);
    animation: bc-wx-snow var(--d) linear infinite;
    animation-delay: var(--dl);
    }
    @keyframes bc-wx-snow {
    0% { transform: translate3d(0, -16px, 0); }
    50% { transform: translate3d(var(--drift, 18px), 50vh, 0); }
    100% { transform: translate3d(0, 110vh, 0); }
    }
    .bc-wx-p.hail {
    top: -20px;
    border-radius: 50%;
    background: rgba(255,255,255,1);
    box-shadow:
    0 0 0 1px rgba(255,255,255,.85),
    0 1px 1px rgba(0,0,0,.08);
    animation: bc-wx-hail var(--d) linear infinite;
    animation-delay: var(--dl);
    }
    @keyframes bc-wx-hail {
    0% { transform: translate3d(0, -20px, 0); }
    100% { transform: translate3d(var(--drift, 4px), 110vh, 0); }
    }
    .bc-wx-p.star {
    border-radius: 50%;
    background: rgba(255,255,255,.95);
    animation: bc-wx-twinkle var(--d) ease-in-out infinite;
    animation-delay: var(--dl);
    }
    @keyframes bc-wx-twinkle {
    0%, 100% { opacity: .15; }
    50% { opacity: 1; }
    }
    .bc-wx-cloud-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    }
    .bc-wx-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    animation: bc-wx-flash 5.2s linear infinite;
    contain: strict;
    transform: translateZ(0);
    }
    @keyframes bc-wx-flash {
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: .25; }
    94% { opacity: 0; }
    96% { opacity: .45; }
    97% { opacity: 0; }
    }
    .bc-weather {
    position: absolute;
    box-sizing: border-box;
    padding: 0 16px 16px !important;
    bottom: 8px;
    left: 0;
    right: 0;
    width: 100%;
    pointer-events: none;
    contain: layout style;
    }
    .bc-weather.bc-wx-top {
    top: 8px;
    bottom: auto;
    }
    .bc-weather-card.bc-wx-weather-only .bc-weather.bc-wx-top {
    top: 50%;
    bottom: auto;
    transform: translateY(-50%);
    padding: 0 16px !important;
    }
    .bc-square-card .bc-weather {
    overflow: hidden;
    padding: 0 8px 8px;
    }
    .bc-square-card .bc-weather-grid {
    align-items: center;
    align-content: center;
    }
    .bc-square-card .bc-weather-day {
    grid-template-rows:
    auto var(--bc-wx-mid-gap, calc(4px * var(--bc-wx-scale)))
    min-content
    var(--bc-wx-mid-gap, calc(4px * var(--bc-wx-scale))) auto;
    align-content: center;
    gap: 0;
    }
    .bc-square-card .bc-weather-day .day-label {
    grid-row: 1;
    margin: 0;
    }
    .bc-square-card .bc-weather-day ha-icon {
    grid-row: 3;
    margin: 0;
    align-self: center;
    line-height: 0px;
    }
    .bc-square-card .bc-weather-day .temps {
    grid-row: 5;
    margin: 0;
    }
    .bc-weather {
    --bc-wx-scale: 1;
    --bc-wx-font: calc(12px * var(--bc-wx-scale));
    --bc-wx-icon-size: calc(26px * var(--bc-wx-scale));
    --bc-wx-icon-row: calc(28px * var(--bc-wx-scale));
    --bc-wx-row-gap: calc(8px * var(--bc-wx-scale));
    --bc-wx-col-gap: calc(8px * var(--bc-wx-scale));
    }
    .bc-weather-grid {
    display: grid;
    gap: var(--bc-wx-col-gap);
    align-items: end;
    width: 100%;
    }
    .bc-weather-day {
    display: grid;
    grid-template-rows: auto var(--bc-wx-icon-row) auto;
    justify-items: center;
    text-align: center;
    gap: var(--bc-wx-row-gap);
    }
    .bc-weather-day .day-label {
    font-size: var(--bc-wx-font);
    line-height: 1.05;
    opacity: .9;
    }
    .bc-weather-day ha-icon {
    width: var(--bc-wx-icon-size);
    height: var(--bc-wx-icon-size);
    --mdc-icon-size: var(--bc-wx-icon-size);
    align-self: center;
    line-height: 0;
    }
    .bc-weather-day .temps {
    display: grid;
    grid-auto-flow: row;
    gap: 2px;
    align-items: center;
    justify-items: center;
    font-size: var(--bc-wx-font);
    line-height: 1.05;
    }
    .bc-weather-day .hi {
    font-weight: 600;
    }
    .bc-weather-day .lo {
    opacity: .85;
    min-height: 1.05em;
    }
