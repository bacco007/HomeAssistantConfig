---
bubble_entity_graph:
  default:
    - title: ""
    - entity: sun.sun
    - colour_hex: "#FFFFFF"
    - colour_rgb: "0,0,0"
    - hours_to_show: 24
    - points_per_hour: 6
    - line_width: 3
  card:
    type: custom:stack-in-card
    card_mod:
      style: |
        ha-card {
          # background-color: var(--background-color);
          box-shadow: none !important;
        }
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: "[[entity]]"
        name: "[[title]]"
        show_state: true
        scrolling_effect: false
        card_layout: normal
        icon: mdi:download-network
        show_attribute: true
        styles: |-
          .bubble-button-card-container {
            background-color: rgba([[colour_rgb]] ,0.5) !important;
          }
          .bubble-icon {
            color: rgb([[colour_rgb]]) !important;
            opacity: 1 !important;
          }
      - type: custom:statistics-graph-chart-card
        card_shadow: false
        card_border: false
        show_grid: false
        show_y_axis: false
        show_y2_axis: false
        show_x_axis: false
        hours_to_show: "[[hours_to_show]]"
        points_per_hour: "[[points_per_hour]]"
        height: 50
        x_grid_style: dashed
        y_grid_style: dashed
        state_layout: horizontal
        group_by: hour
        entities:
          - entity: "[[entity]]"
            line_width: "[[line_width]]"
            name: " "
            color: "[[colour_hex]]"
            aggregate_func: last
            points_per_hour: "[[points_per_hour]]"
            number_format: dot
            value_transform: "return x > 0 ? x : first"
            state_adaptive_color: true
            show_extrema: never
            show_state: false
            break_on_null: false
            show_trend_icon: false
        annotations: []
        card_mod:
          style: |
            ha-card {
              # background-color: var(--background-color) !important;
              border-radius: 5px;
              box-shadow: none;
              padding: 0 !important;
            }

