---
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Sun and Moon
    icon: mdi:theme-light-dark
    styles: |-
      .bubble-line {
        background: var(--ha-card-background);
        opacity: 1;
        }
    sub_button:
      - icon: mdi:arrow-top-right-thick
        tap_action:
          action: navigate
          navigation_path: "#weather"
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sun.sun
    scrolling_effect: false
    show_state: true
    sub_button:
      - entity: sensor.next_sunrise
        show_state: true
        icon: ios:sunrise-fill
      - entity: sensor.next_sunset
        show_name: false
        show_state: true
        icon: ios:sunset-fill
    name: Sunrise / Sunset
    show_last_changed: false
    icon: mdi:theme-light-dark
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.tbsmarthome_sun_daylight
    scrolling_effect: false
    show_state: false
    sub_button:
      - entity: sensor.tbsmarthome_sun_daylight
        show_state: false
        icon: mdi:calendar-today
        show_background: true
        show_attribute: true
        attribute: today_hms
        show_name: true
        name: D
      - entity: sensor.tbsmarthome_sun_daylight
        show_name: false
        show_state: false
        icon: mdi:calendar-arrow-right
        show_background: false
        show_attribute: true
        attribute: tomorrow_hms
        name: ""
      - entity: sensor.tbsmarthome_sun_night
        show_state: false
        icon: mdi:calendar-today
        show_background: true
        show_attribute: true
        attribute: today_hms
        show_name: true
        name: "N"
      - entity: sensor.tbsmarthome_sun_night
        show_name: false
        show_state: false
        icon: mdi:calendar-arrow-right
        show_background: false
        show_attribute: true
        attribute: tomorrow_hms
        name: ""
    modules:
      - default
    name: Day/Night Length
    styles: |-
      .bubble-sub-button-1 {
          background-color: '#F03A3E' !important;
      }
      .bubble-sub-button-3 {
          background-color: '#F03A3E' !important;
      }
    card_layout: large-2-rows

  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.daylight_saving_status
