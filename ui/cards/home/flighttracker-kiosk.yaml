---
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Flight Tracker
    icon: mdi:airplane-check
    styles: |-
      .bubble-line {
        background: var(--ha-card-background);
        opacity: 1;
        }
    sub_button:
      - icon: mdi:arrow-top-right-thick
        show_name: false
        show_attribute: false
        show_background: false
        tap_action:
          action: navigate
          navigation_path: "#flightsnear"
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        entity: sensor.flighttracker_aircraft_total
        button_type: state
        name: Current (ADS-B)
      - type: custom:bubble-card
        card_type: button
        entity: sensor.flightradar24_current_in_area
        button_type: state
        name: Current (FR24)
  - type: custom:bubble-card
    card_type: button
    entity: sensor.flights_above_hourly
    button_type: state
    icon: mdi:airplane-alert
    name: Flight History (FR24)
    attribute: state_class
    sub_button:
      - entity: sensor.flights_above_hourly
        icon: mdi:clock-start
        show_attribute: false
        show_state: true
        show_background: false
      - entity: sensor.flights_above_daily
        icon: mdi:calendar-today
        show_attribute: false
        show_state: true
        show_background: false
      - entity: sensor.flights_above_weekly
        icon: mdi:calendar-week
        show_attribute: false
        show_state: true
        show_background: false
    styles: ""
    show_state: false
    show_last_changed: false
    card_layout: normal
    columns: 2
    rows: 2
    show_icon: true
    scrolling_effect: false
    show_name: true
    show_attribute: false

  - type: custom:mushroom-legacy-template-card
    primary: Last Plane of Interest (Plane Alert)
    secondary: >-
      {{state_attr(entity, 'owner')}}

      ({{state_attr(entity, 'tail')}}, {{state_attr(entity, 'callsign')}}, {{state_attr(entity, 'type')}}) / {{state_attr(entity, 'db:tag2')}} / {{state_attr(entity, 'db:link')}} 

      Last Seen {{ state_attr(entity, 'time:time_at_mindist') | int | timestamp_custom('%A, %B %d at %H:%M', true) }}
    entity: sensor.adsb_planealert
    fill_container: true
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    multiline_secondary: true
    icon: ""
    card_mod:
      style:
        mushroom-state-info$: |
          .container {
            text-align: right;
          }
        .: |

          ha-card {
            # background-color: var(--background-color);
            box-shadow: none;
          }
