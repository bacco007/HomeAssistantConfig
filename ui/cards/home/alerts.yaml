---
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Alerts
    icon: mdi:home-alert-outline
    styles: |-
      .bubble-line {
        background: var(--ha-card-background);
        opacity: 1;
        }
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.integrations_with_issues
        state_not: "0"
    card:
      type: custom:bubble-card
      card_type: button
      button_type: state
      entity: sensor.integrations_with_issues
      name: Offline Integrations
      sub_button:
        main:
          - entity: sensor.integrations_with_issues
            show_attribute: false
            attribute: count
            show_icon: false
            show_last_changed: false
            show_state: true
            show_name: false
            state_background: true
        bottom: []
      icon: ""
      show_state: false
      show_last_changed: true
      show_attribute: false

