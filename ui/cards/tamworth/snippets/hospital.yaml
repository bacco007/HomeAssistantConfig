---
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Tamworth Hospital - People Waiting
    icon: mdi:hospital
    styles: |-
      .bubble-line {
        background: var(--ha-card-background);
        opacity: 1;
        }
    sub_button:
      - show_name: false
        show_icon: false
        show_state: true
        show_background: true
        entity: sensor.tamhospital_waitingtime
  - type: custom:statistics-graph-chart-card
    show_now_line: false
    show_grid: false
    show_y2_axis: false
    animate_graph: true
    points_per_hour: 4
    height: 250
    graph_start: day
    show_full_period: true
    x_grid_style: dashed
    y_grid_style: dashed
    align_header: center
    state_layout: horizontal
    group_by: hour
    entities:
      - entity: sensor.tamhospital_waitingtime
        name: Current
        aggregate_func: max
        decimals: 0
        show_in_legend: true
        show_state: false
        show_trend_icon: false
        legend_stats:
          - min
          - max
      - entity: sensor.tamhospital_waitingtime
        name: Yesterday
        time_offset: 1d
        aggregate_func: max
        decimals: 0
        show_in_legend: true
        show_state: false
        show_trend_icon: false
        legend_stats:
          - min
          - max
        offset: "24"
        show_fill: false
      - entity: sensor.tamhospital_waitingtime
        attribute: usual_patients
        name: Usual Waiting
        aggregate_func: max
        decimals: 0
        show_in_legend: true
        show_state: false
        show_trend_icon: false
        legend_stats:
          - min
          - max
        show_fill: false
      - entity: sensor.tamhospital_waitingtime
        attribute: capacity
        name: Capacity
        aggregate_func: max
        decimals: 0
        show_in_legend: true
        show_state: false
        show_trend_icon: false
        legend_stats:
          - min
          - max
        offset: "24"
        show_fill: false
    annotations: []

  - type: entities
    entities:
      - type: custom:fold-entity-row
        head:
          type: custom:template-entity-row
          name: Average People Waiting (Last Week)
          icon: mdi:hospital
          state: ""
        padding: 0
        entities:
          - type: custom:plotly-graph
            hours_to_show: 1w
            refresh_interval: 120
            entities:
              - entity: sensor.tamhospital_waitingtime
                statistic: mean
                period: hour
                connectgaps: true
                show_value: true
                texttemplate: <b>%{y:,.0f}</b>
                line:
                  width: 3
                  color: yellow
                  shape: step
            layout:
              paper_bgcolor: rgba(0,0,0,0)
              plot_bgcolor: rgba(0,0,0,0)
              showlegend: false
              height: 200
              margin:
                autoexpand: false
                l: 50
                r: 50
              xaxis:
                showline: true
                showgrid: false
                showticklabels: true
                linecolor: rgb(204,204,204)
                linewidth: 2
                autotick: true
                ticks: outside
                tickwidth: 2
                ticklen: 5
                tickfont:
                  family: Roboto
                  size: 12
                  color: rgb(204,204,204)
              yaxis:
                title: ""
                linecolor: rgb(204,204,204)
                linewidth: 2
                tickfont:
                  family: Roboto
                  size: 12
                  color: rgb(204,204,204)
              dragmode: false
            config:
              scrollZoom: false
