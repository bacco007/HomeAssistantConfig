---
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: NSW Live Traffic
    icon: mdi:car-multiple
    entity: sensor.stats_livetraffic
    styles: |-
      .bubble-line {
        background: var(--ha-card-background);
        opacity: 1;
        }
    sub_button:
      - show_name: false
        show_icon: false
        show_last_changed: false
        show_state: true
      - tap_action:
          action: navigation
          navigation_path: http://www.livetraffic.com
        icon: mdi:menu
        show_background: false
  - type: custom:bubble-card
    entity: binary_sensor.livetrafficnsw_nearby_active_incident
    card_type: button
    button_type: state
    name: Incidents Near Me
    show_state: false
    sub_button:
      - entity: binary_sensor.livetrafficnsw_nearby_active_incident
        show_attribute: true
        attribute: count
  - type: custom:statistics-graph-chart-card
    sparkline: true
    hours_to_show: 168
    points_per_hour: 1
    height: 400
    group_by: hour
    entities:
      - entity: sensor.stats_livetraffic
        attribute: alpine
        name: Alpine
        aggregate_func: max
        decimals: 0
      - entity: sensor.stats_livetraffic
        attribute: fire
        name: Fire
        aggregate_func: max
        decimals: 0
      - entity: sensor.stats_livetraffic
        attribute: flood
        name: Flood
        aggregate_func: max
        decimals: 0
      - entity: sensor.stats_livetraffic
        attribute: incidents
        name: Incidents
        aggregate_func: max
        decimals: 0
      - entity: sensor.stats_livetraffic
        attribute: incidents_lga
        name: Incidents (LGA)
        aggregate_func: max
        decimals: 0
      - entity: sensor.stats_livetraffic
        attribute: majorevents
        name: Major Events
        aggregate_func: max
        decimals: 0
      - entity: sensor.stats_livetraffic
        attribute: roadwork
        name: Roadwork
        aggregate_func: max
        decimals: 0
  - square: false
    type: grid
    columns: 2
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        icon: mdi:snowflake-alert
        name: Alpine
        entity: sensor.getdata_livetrafficnsw_alpine
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#livetraffic-alpine"
        styles: &style |-
          .bubble-button-card-container {
            background-color: rgba(${state > 0 ? "255,120,50" : "transparent" },0.35) !important;
          }
          .bubble-icon {
            color: rgba(${state > 0 ? "255, 120, 50"  : "white" },1) !important;
            opacity: 1 !important;
          }
      - type: custom:bubble-card
        card_type: button
        button_type: state
        icon: mdi:fire-alert
        name: Fire
        entity: sensor.getdata_livetrafficnsw_fire
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#livetraffic-fire"
        styles: *style
      - type: custom:bubble-card
        card_type: button
        button_type: state
        icon: mdi:home-flood
        name: Flood
        entity: sensor.getdata_livetrafficnsw_flood
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#livetraffic-flood"
        styles: *style
      - type: custom:bubble-card
        card_type: button
        button_type: state
        icon: mdi:road-variant
        name: Incidents
        entity: sensor.getdata_livetrafficnsw_incidents
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#livetraffic-incidents"
        styles: *style
      - type: custom:bubble-card
        card_type: button
        button_type: state
        icon: mdi:road-variant
        name: Incidents LGA
        entity: sensor.getdata_livetrafficnsw_incidentslga
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#livetraffic-incidentslga"
        styles: *style
      - type: custom:bubble-card
        card_type: button
        button_type: state
        icon: mdi:party-popper
        name: Major Events
        entity: sensor.getdata_livetrafficnsw_majorevents
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#livetraffic-majorevents"
        styles: *style
      - type: custom:bubble-card
        card_type: button
        button_type: state
        icon: mdi:dump-truck
        name: Roadwork
        entity: sensor.getdata_livetrafficnsw_roadwork
        button_action:
          tap_action:
            action: navigate
            navigation_path: "#livetraffic-roadwork"
        styles: *style
