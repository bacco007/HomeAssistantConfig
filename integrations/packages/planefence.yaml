      #######################################################################
      # Expected Alerts By Now
      #######################################################################

      - name: "Plane-Alert Expected By Now"
        unique_id: plane_alert_expected_by_now
        icon: mdi:chart-bell-curve

        state: >
          {% set series =
            state_attr(
              'sensor.plane_alert_insights_data',
              'series'
            )
            | default([], true)
          %}

          {% set selected_date =
            state_attr(
              'sensor.plane_alert_insights_data',
              'selected_date'
            )
          %}

          {% set ns = namespace(values=[]) %}

          {% for day in series %}
            {% if
              day.date != selected_date
              and day.total_cutoff is defined
            %}
              {% set ns.values =
                ns.values + [day.total_cutoff | float(0)]
              %}
            {% endif %}
          {% endfor %}

          {{
            ns.values
            | median(default=0)
            | round(1)
          }}
        unit_of_measurement: 'Aircraft'

        attributes:
          samples: >
            {% set series =
              state_attr(
                'sensor.plane_alert_insights_data',
                'series'
              )
              | default([], true)
            %}

            {% set selected_date =
              state_attr(
                'sensor.plane_alert_insights_data',
                'selected_date'
              )
            %}

            {{
              series
              | rejectattr('date', 'eq', selected_date)
              | map(attribute='total_cutoff')
              | list
            }}

      #######################################################################
      # Alert Activity vs Expected
      #######################################################################

      - name: "Plane-Alert Activity vs Expected"
        unique_id: plane_alert_activity_vs_expected
        icon: mdi:chart-line-variant
        unit_of_measurement: "%"

        state: >
          {% set actual =
            states('sensor.plane_alert_today')
            | float(0)
          %}

          {% set expected =
            states('sensor.plane_alert_expected_by_now')
            | float(0)
          %}

          {% if expected > 0 %}
            {{
              (
                (
                  actual - expected
                ) / expected * 100
              )
              | round(1)
            }}
          {% else %}
            0
          {% endif %}

