- id: '1751697921200'
  alias: Restart Zigbee2MQTT if lights unavailable
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - light.office_lamp
    - light.bedroom_lamp
    to: unavailable
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions: []
  actions:
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: 45df7312_zigbee2mqtt
  mode: single
- id: '1767396737607'
  alias: '[TIME] Sync IKEA ALPSTUGA'
  description: ''
  triggers:
  - at: 03:15:00
    trigger: time
  - entity_id:
    - switch.alpstuga_air_quality_monitor
    from:
    - unavailable
    to:
    trigger: state
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: matter_time_sync.sync_time
    data:
      node_id: 22
      endpoint: 0
  mode: restart
- id: '1769834483895'
  alias: '[FlightRadar24] Set Airport'
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: text.set_value
    metadata: {}
    target:
      entity_id: text.flightradar24_airport_track
    data:
      value: YSTW
  mode: single
- id: '1770330241255'
  alias: Bedroom Rodret Controller
  description: ''
  use_blueprint:
    path: EPMatt/ikea_e2201.yaml
    input:
      controller_device: 7a1b17cac52ea330cc645bf99cdeb3aa
      action_button_up_short:
      - action: light.turn_off
        metadata: {}
        target:
          device_id:
          - 0c04d9c50880394d109ed86d4c310ce8
          - f52ffba24d8182f49f07691f01dfe4e3
        data: {}
      - action: media_player.media_stop
        metadata: {}
        target:
          entity_id:
          - media_player.bedroom_symfonisk
          - media_player.office_sonos
        data: {}
      action_button_down_short:
      - action: light.turn_on
        metadata: {}
        target:
          device_id: f52ffba24d8182f49f07691f01dfe4e3
        data: {}
- id: sonos_favourites_play_from_webhook
  alias: '[Sonos Favourites] Play Favourite From Webhook'
  description: ''
  triggers:
  - webhook_id: sonos_play_favourite
    allowed_methods:
    - POST
    - PUT
    local_only: true
    trigger: webhook
  actions:
  - variables:
      favourite: '{{ trigger.json.favourite | default(trigger.data.favourite, true)
        }}'
      player: '{{ trigger.json.player | default(trigger.data.player, true) | default(''media_player.office_sonos'',
        true) }}'
  - action: script.sonos_favourites_play_favourite
    data:
      favourite: '{{ favourite }}'
      player: '{{ player }}'
  mode: queued
