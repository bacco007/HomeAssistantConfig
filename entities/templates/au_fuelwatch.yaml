    state_class: measurement
    icon: mdi:airplane

  - name: AU Total Daily Litres
    unique_id: au_total_daily_litres
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'totalDailyLitres') }}"
    unit_of_measurement: "L/day"
    state_class: measurement
    icon: mdi:water

  - name: AU Total Daily Barrels
    unique_id: au_total_daily_barrels
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'totalDailyBarrels') }}"
    unit_of_measurement: "barrels/day"
    state_class: measurement
    icon: mdi:barrel

  - name: AU Petrol In Country Days
    unique_id: au_petrol_in_country_days
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'petrol').inCountryDays }}"
    unit_of_measurement: "days"
    state_class: measurement
