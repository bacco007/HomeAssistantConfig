  - name: AU Petrol In Water Days
    unique_id: au_petrol_in_water_days
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'petrol').inWaterDays }}"
    unit_of_measurement: "days"
    state_class: measurement
    icon: mdi:ferry

  - name: AU Petrol Total Days
    unique_id: au_petrol_total_days
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'petrol').totalDays }}"
    unit_of_measurement: "days"
    state_class: measurement
