---
sensor:
  - name: AU Fuel Risk Level
    unique_id: au_fuel_risk_level
    state: "{{ states('sensor.au_fuel_watch_raw') }}"
    icon: >-
      {% set risk = states('sensor.au_fuel_watch_raw') %}
      {% if risk == 'high' %}
        mdi:alert
      {% elif risk == 'medium' %}
        mdi:alert-outline
      {% else %}
        mdi:check-circle-outline
      {% endif %}

  - name: AU Fuel Most Critical
    unique_id: au_fuel_most_critical
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'mostCritical') }}"
    icon: mdi:fuel

  - name: AU Fuel Most Critical Days
    unique_id: au_fuel_most_critical_days
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'mostCriticalDays') }}"
    unit_of_measurement: "days"
    state_class: measurement
    icon: mdi:calendar-clock

  - name: AU Fuel Depletion Date
    unique_id: au_fuel_depletion_date
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'depletionDate') }}"
    icon: mdi:calendar-alert

  - name: AU Fuel MBIE Data Date
    unique_id: au_fuel_mbie_data_date
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'mbieDataDate') }}"
    icon: mdi:calendar

  - name: AU Petrol Estimated Days
    unique_id: au_petrol_estimated_days
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'estimatedPetrolDays') }}"
    unit_of_measurement: "days"
    state_class: measurement
    icon: mdi:gas-station

  - name: AU Diesel Estimated Days
    unique_id: au_diesel_estimated_days
    state: "{{ state_attr('sensor.au_fuel_watch_raw', 'estimatedDieselDays') }}"
    unit_of_measurement: "days"
    state_class: measurement
    icon: mdi:truck

  - name: AU Jet Estimated Days
    unique_id: au_jet_estimated_days
