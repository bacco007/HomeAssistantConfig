---
resource: https://nzoilwatch.com/api/fuel-data?country=au
scan_interval: 3600
sensor:
  - name: AU Fuel Watch Raw
    unique_id: au_fuel_watch_raw
    value_template: "{{ value_json.riskLevel }}"
    json_attributes:
      - petrol
      - diesel
      - jet
      - totalDailyLitres
      - totalDailyBarrels
      - mbieDataDate
      - elapsedDays
      - estimatedPetrolDays
      - estimatedDieselDays
      - estimatedJetDays
      - mostCritical
      - mostCriticalDays
      - depletionDate
      - riskLevel