  nord6: "#eceff4"
  nord7: "#8fbcbb"
  nord8: "#88c0d0"
  nord9: "#81a1c1"
  nord10: "#5e81ac"
  nord11: "#bf616a"
  nord12: "#d08770"
  nord13: "#ebcb8b"
  nord14: "#a3be8c"
  nord15: "#b48ead"

  # Darker Nord base
  background-color: "#2e3440"
  primary-background-color: "#2e3440"
  background-color-2: "#3b4252"
  secondary-background-color: "#3b4252"
  card-background-color: "#3b4252"
  paper-card-background-color: "#3b4252"
  ha-card-background: "#3b4252"

  # Custom Lovelace colour system
  tint1: "1"
  tint2: "0.3"
  tint3: "0.15"

  black-rgb: "46,52,64"
  white-rgb: "236,239,244"
