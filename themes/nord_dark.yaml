  black: "rgb(var(--black-rgb))"
  grey: "rgb(var(--grey-rgb))"
  white: "rgb(var(--white-rgb))"

  title: "rgba(var(--ocean-blue-rgb),var(--tint1))"
  text-on: "rgba(var(--white-rgb),0.9)"
  text-off: "rgba(var(--white-rgb),0.6)"
