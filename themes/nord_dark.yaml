  green-rgb: "163,190,140"
  purple-rgb: "180,142,173"

  blue: "rgb(var(--blue-rgb))"
  icon-blue: "rgba(var(--blue-rgb),var(--tint1))"
  img-cell-blue: "rgba(var(--blue-rgb),var(--tint2))"
